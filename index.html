<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>GivenchyFarms</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* PANTALLA INICIAL */
    #startScreen {
      width: 100vw;
      height: 100vh;
      background: white;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      position: fixed;
      inset: 0;
      z-index: 10;
    }

    .top-image {
      width: 75vw;
      max-width: 300px;

      animation: dance 2.2s ease-in-out infinite;

      user-select: none;
      -webkit-user-drag: none;

      margin-bottom: 35px;
    }

    /* BOTÓN */
    #startButton {
      border: none;
      outline: none;

      background: #000;
      color: white;

      font-size: 18px;
      font-weight: bold;

      padding: 16px 42px;

      border-radius: 12px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      box-shadow: 0 6px 18px rgba(0,0,0,.2);

      transition: transform .15s ease;
    }

    #startButton:active {
      transform: scale(.92);
    }

    /* VIDEO */
    #content {
      display: none;

      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      background: black;

      z-index: 5;
    }

    #mainVideo {
      position: absolute;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      display: block;

      background: black;
    }

    /* INFORMACIÓN */
    .verification {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 20px;

      z-index: 3;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      pointer-events: none;
    }

    .bottom-image {
      width: 190px;

      animation: dance 2.2s ease-in-out infinite;

      user-select: none;
      -webkit-user-drag: none;

      margin-bottom: 12px;
    }

    .verified {
      font-size: 20px;
      font-weight: 800;

      color: white;

      text-shadow:
        0 2px 6px rgba(0,0,0,.9),
        0 0 10px rgba(0,0,0,.7);

      margin-bottom: 12px;
    }

    .verified span {
      color: #d00000;
    }

    /* INSTAGRAM */
    .instagram {
      pointer-events: auto;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      color: white;
      text-decoration: none;

      font-size: 17px;
      font-weight: 700;

      text-shadow:
        0 2px 5px rgba(0,0,0,.9);

      -webkit-tap-highlight-color: transparent;
    }

    .instagram-icon {
      width: 24px;
      height: 24px;

      border: 2px solid white;
      border-radius: 7px;

      position: relative;

      box-shadow: 0 2px 5px rgba(0,0,0,.5);
    }

    .instagram-icon::before {
      content: "";

      position: absolute;

      width: 9px;
      height: 9px;

      border: 2px solid white;
      border-radius: 50%;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);
    }

    .instagram-icon::after {
      content: "";

      position: absolute;

      width: 3px;
      height: 3px;

      background: white;
      border-radius: 50%;

      top: 4px;
      right: 4px;
    }

    /* ANIMACIÓN */
    @keyframes dance {

      0% {
        transform: translateY(0) rotate(-2deg) scale(1);
      }

      25% {
        transform: translateY(-10px) rotate(3deg) scale(1.04);
      }

      50% {
        transform: translateY(0) rotate(-2deg) scale(1);
      }

      75% {
        transform: translateY(10px) rotate(3deg) scale(1.04);
      }

      100% {
        transform: translateY(0) rotate(-2deg) scale(1);
      }

    }

    @media (max-width: 430px) {

      .top-image {
        width: 70vw;
      }

      #startButton {
        font-size: 17px;
        padding: 15px 38px;
      }

      .bottom-image {
        width: 175px;
      }

      .verified {
        font-size: 19px;
      }

      .instagram {
        font-size: 16px;
      }

      .instagram-icon {
        width: 23px;
        height: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- PANTALLA INICIAL -->
  <div id="startScreen">

    <img
      class="top-image"
      src="https://files.catbox.moe/w6r7id.png"
      alt=""
    >

    <button id="startButton">
      Pre-Roll
    </button>

  </div>


  <!-- VIDEO -->
  <div id="content">

    <video
      id="mainVideo"
      src="https://files.catbox.moe/adl2kc.mov"
      playsinline
      webkit-playsinline
      loop
      preload="auto"
    ></video>


    <!-- VERIFICACIÓN -->
    <div class="verification">

      <img
        class="bottom-image"
        src="https://files.catbox.moe/nm2lb6.png"
        alt=""
      >

      <div class="verified">
        Producto verificado de
        <span>GivenchyFarms</span>
      </div>

      <!-- INSTAGRAM -->
      <a
        class="instagram"
        href="https://www.instagram.com/givenchyfarms?stkn=MW1jNmg5ajVtZHUzbw=="
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="instagram-icon"></span>
        @givenchyfarms
      </a>

    </div>

  </div>


  <!-- MÚSICA -->
  <audio
    id="music"
    src="https://files.catbox.moe/l2cu1b.mp3"
    loop
    preload="auto"
  ></audio>


  <script>

    const button = document.getElementById("startButton");
    const startScreen = document.getElementById("startScreen");
    const content = document.getElementById("content");

    const video = document.getElementById("mainVideo");
    const music = document.getElementById("music");


    button.addEventListener("click", async function () {

      startScreen.style.display = "none";
      content.style.display = "block";

      video.currentTime = 0;
      music.currentTime = 0;

      try {
        await video.play();
      } catch (error) {
        console.log("Video:", error);
      }

      try {
        await music.play();
      } catch (error) {
        console.log("Audio:", error);
      }

    });

  </script>

</body>
</html>

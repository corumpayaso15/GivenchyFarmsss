<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wild Art | Verificación Oficial</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body{
background:#000;
color:#fff;
overflow:hidden;
}

video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
backdrop-filter:blur(2px);
z-index:-1;
}

/* PANTALLA 1 */

#home{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
gap:4px;
}

.mainGif{
width:560px;
max-width:90%;
display:block;
margin:0;
}

.brand{
font-size:56px;
font-weight:900;
letter-spacing:4px;
line-height:1;
margin:0;
}

.subtitle{
font-size:18px;
opacity:.85;
margin:0;
}

.btn{
margin-top:12px;
border:none;
background:#fff;
color:#000;
padding:18px 50px;
border-radius:50px;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* PANTALLA 2 */

#verify{
display:none;
height:100vh;
overflow-y:auto;
padding:30px 20px 80px;
text-align:center;
}

.cornerGif{
position:fixed;
top:20px;
right:20px;
width:150px;
z-index:999;
}

.brandVerify{
margin-top:40px;
font-size:52px;
font-weight:900;
letter-spacing:4px;
}

.productImg{
width:420px;
max-width:90%;
border-radius:22px;
margin-top:18px;
border:1px solid rgba(255,255,255,.08);
}

.authBox{
max-width:560px;
margin:25px auto;
background:rgba(15,15,15,.82);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
padding:35px;
}

.verifyBadge{
width:220px;
max-width:70%;
margin-bottom:20px;
border-radius:18px;
}

.check{
font-size:65px;
color:#00d26a;
}

.authTitle{
font-size:34px;
font-weight:800;
margin-top:10px;
}

.desc{
margin-top:12px;
line-height:1.6;
opacity:.82;
}

.line{
height:1px;
background:rgba(255,255,255,.08);
margin:24px 0;
}

.counterLabel{
font-size:13px;
letter-spacing:3px;
opacity:.65;
}

.counter{
font-size:72px;
font-weight:900;
margin-top:10px;
}

.status{
margin-top:10px;
font-size:18px;
font-weight:700;
color:#00d26a;
}

.dot{
display:inline-block;
width:10px;
height:10px;
background:#00d26a;
border-radius:50%;
margin-right:8px;
}

@media(max-width:768px){

.mainGif{
width:360px;
}

.brand{
font-size:42px;
}

.brandVerify{
font-size:38px;
}

.productImg{
width:280px;
}

.verifyBadge{
width:170px;
}

.cornerGif{
width:100px;
}

.counter{
font-size:56px;
}

}

</style>
</head>
<body>

<video autoplay muted loop playsinline>
<source src="https://files.catbox.moe/kcbele.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- PANTALLA 1 -->

<div id="home">

<img
src="https://files.catbox.moe/fnmcpj.gif"
class="mainGif">

<div class="brand">
THE WILD ART
</div>

<div class="subtitle">
Certificado Oficial de Autenticidad
</div>

<button class="btn" onclick="showVerification()">
Verificar Producto
</button>

</div>

<!-- PANTALLA 2 -->

<div id="verify">

<img
src="https://files.catbox.moe/fnmcpj.gif"
class="cornerGif">

<h1 class="brandVerify">
THE WILD ART
</h1>

<img
src="https://files.catbox.moe/bvrnej.jpeg"
class="productImg">

<div class="authBox">

<img
src="https://files.catbox.moe/7iq5tr.jpeg"
class="verifyBadge">

<div class="check">✓</div>

<div class="authTitle">
Producto Auténtico
</div>

<div class="desc">
La autenticidad de este producto ha sido validada correctamente.
</div>

<div class="line"></div>

<div class="counterLabel">
VERIFICACIONES
</div>

<div class="counter" id="count">
0
</div>

<div class="line"></div>

<div class="status">
<span class="dot"></span>
Verificado
</div>

</div>

</div>

<audio id="bgMusic" loop>
<source src="https://files.catbox.moe/takf9g.mp3" type="audio/mpeg">
</audio>

<script>

function showVerification(){

const music = document.getElementById("bgMusic");

music.volume = 0.7;
music.play();

document.getElementById("home").style.display = "none";
document.getElementById("verify").style.display = "block";

let count = localStorage.getItem("wildart_counter");

if(!count){
count = 1;
}else{
count = parseInt(count) + 1;
}

localStorage.setItem("wildart_counter", count);

document.getElementById("count").innerText =
Number(count).toLocaleString();

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      viewport-fit=cover">
<title>Givenchy Farms</title>
<style>
/* =====================================================
   RESET
===================================================== */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
html,
body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}
body{
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
/* =====================================================
   INTRO
===================================================== */
.intro{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  overflow:hidden;
  transition:
    opacity .65s ease,
    visibility .65s ease;
}
.intro.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.intro-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  filter:
    brightness(.55)
    contrast(1.2);
}
.intro::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle,
      transparent 10%,
      rgba(0,0,0,.3) 55%,
      rgba(0,0,0,.9) 100%
    );
  pointer-events:none;
}
/* =====================================================
   ENTER
===================================================== */
.enter{
  position:relative;
  z-index:10;
  border:0;
  background:transparent;
  color:#fff;
  font-size:clamp(25px,7vw,38px);
  font-weight:900;
  letter-spacing:8px;
  padding:20px 30px;
  cursor:pointer;
  text-shadow:
    0 0 10px rgba(255,255,255,.7),
    0 0 25px rgba(255,255,255,.3);
  animation:
    enterPulse 1.8s ease-in-out infinite;
}
.enter::after{
  content:"";
  display:block;
  width:60%;
  height:1px;
  margin:8px auto 0;
  background:rgba(255,255,255,.85);
}
@keyframes enterPulse{
  0%,100%{
    opacity:.65;
    transform:scale(1);
  }
  50%{
    opacity:1;
    transform:scale(1.07);
  }
}
/* =====================================================
   VIDEO PRINCIPAL
===================================================== */
.main-video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  background:#000;
  opacity:.16;
  filter:
    brightness(.42)
    contrast(1.3);
}
/* =====================================================
   CAPA OSCURA
===================================================== */
.dark-layer{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(
      circle at center,
      transparent 4%,
      rgba(0,0,0,.5) 55%,
      #000 100%
    );
}
/* =====================================================
   FLOTANTES
===================================================== */
.floating-container{
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
  overflow:hidden;
}
.floating{
  position:absolute;
  width:75px;
  height:auto;
  opacity:0;
  animation:
    floatingMove 5.5s linear infinite,
    floatingFlicker 1.5s steps(2) infinite;
}
/* POSICIONES */
.floating:nth-child(1){
  left:3%;
  top:7%;
}
.floating:nth-child(2){
  right:4%;
  top:15%;
  animation-delay:1s;
}
.floating:nth-child(3){
  left:3%;
  top:45%;
  animation-delay:2s;
}
.floating:nth-child(4){
  right:4%;
  top:48%;
  animation-delay:2.8s;
}
.floating:nth-child(5){
  left:5%;
  bottom:10%;
  animation-delay:3.7s;
}
.floating:nth-child(6){
  right:5%;
  bottom:12%;
  animation-delay:4.5s;
}
/* =====================================================
   GIVENCHY FLOTANTE
===================================================== */
.givenchy-floating{
  position:absolute;
  width:55px;
  height:auto;
  opacity:0;
  animation:
    givenchyBounce 5s ease-in-out infinite,
    givenchyFlicker 1.4s steps(2) infinite;
}
.givenchy-floating:nth-child(7){
  left:17%;
  top:7%;
  animation-delay:.7s;
}
.givenchy-floating:nth-child(8){
  right:17%;
  top:25%;
  animation-delay:1.8s;
}
.givenchy-floating:nth-child(9){
  left:14%;
  bottom:18%;
  animation-delay:3s;
}
.givenchy-floating:nth-child(10){
  right:14%;
  bottom:8%;
  animation-delay:4s;
}
/* =====================================================
   ANIMACIONES
===================================================== */
@keyframes floatingMove{
  0%{
    opacity:0;
    transform:
      translate(0,0)
      rotate(-10deg)
      scale(.5);
  }
  15%{
    opacity:.3;
  }
  35%{
    transform:
      translate(25px,30px)
      rotate(8deg)
      scale(.7);
  }
  55%{
    opacity:.12;
    transform:
      translate(-20px,65px)
      rotate(-7deg)
      scale(.6);
  }
  70%{
    opacity:.4;
  }
  100%{
    opacity:0;
    transform:
      translate(25px,115px)
      rotate(12deg)
      scale(.45);
  }
}
@keyframes floatingFlicker{
  0%,100%{
    filter:brightness(1);
  }
  45%{
    filter:brightness(.45);
  }
  48%{
    filter:brightness(1.8);
  }
  52%{
    filter:brightness(.55);
  }
}
@keyframes givenchyBounce{
  0%{
    opacity:0;
    transform:
      translate(0,0)
      rotate(-8deg)
      scale(.4);
  }
  15%{
    opacity:.35;
  }
  30%{
    transform:
      translate(30px,-20px)
      rotate(10deg)
      scale(.65);
  }
  50%{
    opacity:.15;
    transform:
      translate(-25px,30px)
      rotate(-7deg)
      scale(.5);
  }
  70%{
    opacity:.4;
    transform:
      translate(20px,60px)
      rotate(8deg)
      scale(.65);
  }
  100%{
    opacity:0;
    transform:
      translate(-15px,110px)
      rotate(-10deg)
      scale(.35);
  }
}
@keyframes givenchyFlicker{
  0%,100%{
    filter:
      brightness(1)
      contrast(1);
  }
  47%{
    filter:brightness(.5);
  }
  50%{
    filter:
      brightness(1.7)
      contrast(1.4);
  }
  53%{
    filter:brightness(.7);
  }
}
/* =====================================================
   CONTENIDO
===================================================== */
.content{
  position:relative;
  z-index:10;
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  /*
     TODO EL CONTENIDO SE SUBE
     PARA QUE ENTRE COMPLETO EN IPHONE
  */
  padding-top:
    max(
      5px,
      env(safe-area-inset-top)
    );
  opacity:0;
  transform:
    scale(.96)
    translateY(8px);
  transition:
    opacity .8s ease,
    transform .8s ease;
}
.content.visible{
  opacity:1;
  transform:
    scale(1)
    translateY(0);
}
/* =====================================================
   LOGO
===================================================== */
.brand-logo{
  width:55px;
  height:auto;
  margin-bottom:2px;
  object-fit:contain;
  filter:
    drop-shadow(
      0 0 13px
      rgba(255,0,0,.3)
    );
  animation:
    brandDance 2.4s ease-in-out infinite;
}
@keyframes brandDance{
  0%,100%{
    transform:
      translateY(0)
      rotate(0deg);
  }
  25%{
    transform:
      translateY(-4px)
      rotate(-3deg);
  }
  50%{
    transform:
      translateY(2px)
      rotate(3deg);
  }
  75%{
    transform:
      translateY(-3px)
      rotate(-2deg);
  }
}
/* =====================================================
   FOTO PRINCIPAL
===================================================== */
.main-image{
  position:relative;
  width:min(84vw,450px);
  display:flex;
  align-items:center;
  justify-content:center;
  animation:
    imageBounce 2.5s ease-in-out infinite;
}
.main-image > img{
  width:100%;
  height:auto;
  display:block;
  filter:
    contrast(1.2)
    brightness(.93)
    drop-shadow(
      0 0 25px
      rgba(0,0,0,.95)
    );
  animation:
    imageGlitch 2.7s infinite;
}
/* =====================================================
   GLITCH
===================================================== */
.main-image::before,
.main-image::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    url(
      "https://files.catbox.moe/3ixrpv.png"
    );
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  opacity:0;
  pointer-events:none;
}
.main-image::before{
  animation:
    glitchOne 2.5s infinite;
}
.main-image::after{
  animation:
    glitchTwo 2.5s infinite;
}
@keyframes imageBounce{
  0%,100%{
    transform:
      translateY(0)
      rotate(0deg);
  }
  25%{
    transform:
      translateY(-5px)
      rotate(-1deg);
  }
  50%{
    transform:
      translateY(2px)
      rotate(1deg);
  }
  75%{
    transform:
      translateY(-2px);
  }
}
@keyframes imageGlitch{
  0%,87%,100%{
    transform:translate(0);
  }
  88%{
    transform:translate(-7px,2px);
  }
  89%{
    transform:translate(8px,-2px);
  }
  90%{
    transform:translate(-4px,0);
  }
  92%{
    transform:translate(0);
  }
}
@keyframes glitchOne{
  0%,83%,100%{
    opacity:0;
  }
  84%{
    opacity:.55;
    transform:
      translate(-11px,0);
    clip-path:
      inset(10% 0 65% 0);
  }
  87%{
    opacity:0;
  }
}
@keyframes glitchTwo{
  0%,88%,100%{
    opacity:0;
  }
  89%{
    opacity:.5;
    transform:
      translate(11px,0);
    clip-path:
      inset(55% 0 20% 0);
  }
  92%{
    opacity:0;
  }
}
/* =====================================================
   PRE-ROLADO
===================================================== */
.pre-roll{
  /*
     LO SUBIMOS DIRECTAMENTE
     Y LO ACERCAMOS A LA FOTO
  */
  position:relative;
  width:min(29vw,120px);
  margin-top:-2px;
  margin-bottom:0;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:.58;
  animation:
    prerollDance 2.8s ease-in-out infinite;
  filter:
    drop-shadow(
      0 0 15px
      rgba(0,0,0,.95)
    );
}
.pre-roll img{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
  animation:
    prerollTilt 2.1s ease-in-out infinite;
}
/* BRILLO */
.pre-roll::after{
  content:"";
  position:absolute;
  left:-30%;
  top:0;
  width:30%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.16),
      transparent
    );
  transform:skewX(-15deg);
  animation:
    productShine 3.5s ease-in-out infinite;
}
@keyframes prerollDance{
  0%,100%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }
  25%{
    transform:
      translateY(-4px)
      rotate(-2deg)
      scale(1.02);
  }
  50%{
    transform:
      translateY(2px)
      rotate(2deg)
      scale(.98);
  }
  75%{
    transform:
      translateY(-3px)
      rotate(-1deg)
      scale(1.02);
  }
}
@keyframes prerollTilt{
  0%,100%{
    transform:rotate(0deg);
  }
  50%{
    transform:rotate(-2deg);
  }
}
@keyframes productShine{
  0%{
    left:-30%;
    opacity:0;
  }
  35%{
    opacity:0;
  }
  50%{
    opacity:.8;
  }
  70%{
    left:120%;
    opacity:0;
  }
  100%{
    left:120%;
    opacity:0;
  }
}
/* =====================================================
   ARRIBA PAPÁ MENCHO
===================================================== */
.titulo{
  /*
     MÁS ARRIBA Y PEGADO AL PRODUCTO
  */
  margin-top:0;
  text-align:center;
  font-size:13px;
  font-weight:900;
  letter-spacing:1.3px;
  text-transform:uppercase;
  text-shadow:
    0 0 12px #000,
    0 0 20px rgba(255,0,0,.25);
  animation:
    titlePulse 2s infinite;
}
.verde{
  color:#00a651;
}
.blanco{
  color:#fff;
}
.rojo{
  color:#d00000;
}
@keyframes titlePulse{
  0%,100%{
    opacity:.8;
  }
  50%{
    opacity:1;
  }
}
/* =====================================================
   REDES
===================================================== */
.socials{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  /*
     REDES MÁS ARRIBA
  */
  margin-top:3px;
  position:relative;
  z-index:20;
}
.social{
  position:relative;
  width:96px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  color:#fff;
  text-decoration:none;
  font-size:8px;
  font-weight:900;
  letter-spacing:.8px;
  background:
    rgba(0,0,0,.82);
  backdrop-filter:
    blur(7px);
  box-shadow:
    0 0 12px
    rgba(0,0,0,.8);
  overflow:hidden;
  animation:
    socialDance 1.8s ease-in-out infinite;
}
.social:nth-child(2){
  animation-delay:.35s;
}
/* INSTAGRAM */
.instagram{
  border:
    1px solid
    rgba(255,60,140,.8);
  text-shadow:
    0 0 8px
    rgba(255,60,140,.7);
}
/* TIKTOK */
.tiktok{
  border:
    1px solid
    rgba(0,220,255,.8);
  text-shadow:
    0 0 8px
    rgba(0,220,255,.7);
}
/* LÍNEA */
.social::before{
  content:"";
  position:absolute;
  left:-100%;
  bottom:0;
  width:100%;
  height:2px;
  animation:
    socialLine 2s linear infinite;
}
.instagram::before{
  background:
    linear-gradient(
      90deg,
      transparent,
      #ff4f91,
      transparent
    );
}
.tiktok::before{
  background:
    linear-gradient(
      90deg,
      transparent,
      #00dcff,
      transparent
    );
}
/* BAILE */
@keyframes socialDance{
  0%,100%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }
  20%{
    transform:
      translateY(-4px)
      rotate(-4deg)
      scale(1.04);
  }
  40%{
    transform:
      translateY(2px)
      rotate(4deg)
      scale(.98);
  }
  60%{
    transform:
      translateY(-3px)
      rotate(-3deg)
      scale(1.03);
  }
  80%{
    transform:
      translateY(1px)
      rotate(2deg)
      scale(1);
  }
}
@keyframes socialLine{
  0%{
    left:-100%;
  }
  50%{
    left:100%;
  }
  100%{
    left:100%;
  }
}
/* =====================================================
   IPHONE
===================================================== */
@media(max-width:430px){
  .content{
    padding-top:
      max(
        4px,
        env(safe-area-inset-top)
      );
  }
  .brand-logo{
    width:52px;
    margin-bottom:1px;
  }
  .main-image{
    width:84vw;
  }
  .pre-roll{
    width:27vw;
    max-width:112px;
    margin-top:-2px;
  }
  .titulo{
    margin-top:0;
    font-size:12px;
    letter-spacing:1.3px;
  }
  .socials{
    margin-top:2px;
    gap:8px;
  }
  .social{
    width:94px;
    height:26px;
    font-size:7.5px;
  }
  .floating{
    width:58px;
  }
  .givenchy-floating{
    width:46px;
  }
}
/* =====================================================
   IPHONE MUY BAJO
===================================================== */
@media(max-height:700px){
  .brand-logo{
    width:45px;
  }
  .main-image{
    width:78vw;
  }
  .pre-roll{
    width:24vw;
    max-width:95px;
  }
  .titulo{
    font-size:11px;
  }
  .social{
    height:24px;
  }
}
/* =====================================================
   REDUCE MOTION
===================================================== */
@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:
      1 !important;
  }
}
</style>
</head>
<body>
<!-- =====================================================
     INTRO
===================================================== -->
<section
  class="intro"
  id="intro">
  <video
    class="intro-video"
    id="introVideo"
    src="https://files.catbox.moe/l8qahy.mov"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto">
  </video>
  <button
    class="enter"
    id="enter"
    type="button">
    ENTER
  </button>
</section>
<!-- =====================================================
     VIDEO PRINCIPAL
===================================================== -->
<video
  class="main-video"
  id="mainVideo"
  src="https://files.catbox.moe/l8qahy.mov"
  muted
  loop
  playsinline
  webkit-playsinline
  preload="auto">
</video>
<div class="dark-layer"></div>
<!-- =====================================================
     FLOTANTES
===================================================== -->
<div class="floating-container">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="givenchy-floating"
    src="https://files.catbox.moe/1k4n1o.png">
  <img
    class="givenchy-floating"
    src="https://files.catbox.moe/1k4n1o.png">
  <img
    class="givenchy-floating"
    src="https://files.catbox.moe/1k4n1o.png">
  <img
    class="givenchy-floating"
    src="https://files.catbox.moe/1k4n1o.png">
</div>
<!-- =====================================================
     CONTENIDO
===================================================== -->
<main
  class="content"
  id="content">
  <!-- LOGO -->
  <img
    class="brand-logo"
    src="https://files.catbox.moe/1k4n1o.png"
    alt="Givenchy Farms">
  <!-- FOTO PRINCIPAL -->
  <div class="main-image">
    <img
      src="https://files.catbox.moe/3ixrpv.png"
      alt="Imagen principal">
  </div>
  <!-- PRE-ROLADO -->
  <div class="pre-roll">
    <img
      src="https://files.catbox.moe/eufb5x.png"
      alt="Producto pre-rolado">
  </div>
  <!-- ARRIBA PAPÁ MENCHO -->
  <div class="titulo">
    <span class="verde">
      ARRIBA
    </span>
    <span class="blanco">
      PAPÁ
    </span>
    <span class="rojo">
      MENCHO
    </span>
  </div>
  <!-- REDES -->
  <div class="socials">
    <a
      class="social instagram"
      href="https://www.instagram.com/givenchyfarms/"
      target="_blank"
      rel="noopener noreferrer">
      📸 INSTAGRAM
    </a>
    <a
      class="social tiktok"
      href="https://www.tiktok.com/@givenchyfarms"
      target="_blank"
      rel="noopener noreferrer">
      ♪ TIKTOK
    </a>
  </div>
</main>
<!-- =====================================================
     MÚSICA
===================================================== -->
<audio
  id="music"
  src="https://files.catbox.moe/9ytgwt.mp3"
  loop
  preload="auto">
</audio>
<script>
/* =====================================================
   ELEMENTOS
===================================================== */
const intro =
  document.getElementById("intro");
const enter =
  document.getElementById("enter");
const content =
  document.getElementById("content");
const music =
  document.getElementById("music");
const introVideo =
  document.getElementById("introVideo");
const mainVideo =
  document.getElementById("mainVideo");
/* =====================================================
   ARRANCAR VIDEO INTRO
===================================================== */
introVideo
  .play()
  .catch(() => {});
/* =====================================================
   PREPARAR VIDEO PRINCIPAL
===================================================== */
mainVideo.load();
/* =====================================================
   ENTER
===================================================== */
enter.addEventListener(
  "click",
  async () => {
    /* MÚSICA */
    try{
      music.currentTime = 0;
      await music.play();
    }catch(error){
      console.log(
        "Safari bloqueó el audio:",
        error
      );
    }
    /* VIDEO PRINCIPAL */
    try{
      await mainVideo.play();
    }catch(error){
      console.log(
        "No se pudo reproducir el video:",
        error
      );
    }
    /* PAUSAR INTRO */
    try{
      introVideo.pause();
    }catch(error){}
    /* OCULTAR INTRO */
    intro.classList.add("hidden");
    /* MOSTRAR CONTENIDO */
    setTimeout(
      () => {
        content.classList.add("visible");
      },
      100
    );
    /* ELIMINAR INTRO */
    setTimeout(
      () => {
        intro.remove();
      },
      750
    );
  }
);
</script>
</body>
</html>

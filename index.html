<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      viewport-fit=cover">
<title>Givenchy Farms</title>
<style>
/* =========================
   RESET
========================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html,
body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}
body {
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}
/* =========================
   INTRO
========================= */
.intro {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
  transition:
    opacity .75s ease,
    visibility .75s ease;
}
.intro.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.intro-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  filter:
    brightness(.55)
    contrast(1.2);
}
.intro::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      circle,
      transparent 12%,
      rgba(0,0,0,.3) 55%,
      rgba(0,0,0,.85) 100%
    );
  pointer-events: none;
}
/* =========================
   ENTER
========================= */
.enter {
  position: relative;
  z-index: 10;
  border: 0;
  background: transparent;
  color: #fff;
  font-size:
    clamp(25px, 7vw, 38px);
  font-weight: 900;
  letter-spacing: 8px;
  padding: 20px 30px;
  cursor: pointer;
  text-shadow:
    0 0 10px rgba(255,255,255,.7),
    0 0 25px rgba(255,255,255,.3);
  animation:
    enterPulse
    1.8s
    ease-in-out
    infinite;
}
.enter::after {
  content: "";
  display: block;
  width: 60%;
  height: 1px;
  margin: 8px auto 0;
  background:
    rgba(255,255,255,.85);
}
@keyframes enterPulse {
  0%,100% {
    opacity: .65;
    transform: scale(1);
  }
  50% {
    opacity: 1;
    transform: scale(1.07);
  }
}
/* =========================
   VIDEO PRINCIPAL
========================= */
.main-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  background: #000;
  opacity: .16;
  filter:
    brightness(.42)
    contrast(1.3);
}
/* =========================
   CAPA NEGRA
========================= */
.dark-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(
      circle at center,
      transparent 4%,
      rgba(0,0,0,.5) 55%,
      #000 100%
    );
}
/* =========================
   FLOTANTES
========================= */
.floating-container {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
}
.floating {
  position: absolute;
  width: 75px;
  height: auto;
  opacity: 0;
  will-change:
    transform,
    opacity;
  animation:
    floatingMove
    5.5s
    linear
    infinite,
    floatingFlicker
    1.5s
    steps(2)
    infinite;
}
/* POSICIONES */
.floating:nth-child(1) {
  left: 3%;
  top: 7%;
  animation-delay: 0s;
}
.floating:nth-child(2) {
  right: 4%;
  top: 15%;
  animation-delay: 1s;
}
.floating:nth-child(3) {
  left: 3%;
  top: 45%;
  animation-delay: 2s;
}
.floating:nth-child(4) {
  right: 4%;
  top: 48%;
  animation-delay: 2.8s;
}
.floating:nth-child(5) {
  left: 5%;
  bottom: 10%;
  animation-delay: 3.7s;
}
.floating:nth-child(6) {
  right: 5%;
  bottom: 12%;
  animation-delay: 4.5s;
}
/* =========================
   LOGOS FLOTANTES
========================= */
.givenchy-floating {
  position: absolute;
  width: 55px;
  height: auto;
  opacity: 0;
  will-change:
    transform,
    opacity;
  animation:
    givenchyBounce
    5s
    ease-in-out
    infinite,
    givenchyFlicker
    1.4s
    steps(2)
    infinite;
}
.givenchy-floating:nth-child(7) {
  left: 17%;
  top: 7%;
  animation-delay: .7s;
}
.givenchy-floating:nth-child(8) {
  right: 17%;
  top: 25%;
  animation-delay: 1.8s;
}
.givenchy-floating:nth-child(9) {
  left: 14%;
  bottom: 18%;
  animation-delay: 3s;
}
.givenchy-floating:nth-child(10) {
  right: 14%;
  bottom: 8%;
  animation-delay: 4s;
}
/* =========================
   ANIMACIONES
========================= */
@keyframes floatingMove {
  0% {
    opacity: 0;
    transform:
      translate(0,0)
      rotate(-10deg)
      scale(.5);
  }
  15% {
    opacity: .3;
  }
  35% {
    transform:
      translate(25px,30px)
      rotate(8deg)
      scale(.7);
  }
  55% {
    opacity: .12;
    transform:
      translate(-20px,65px)
      rotate(-7deg)
      scale(.6);
  }
  70% {
    opacity: .4;
  }
  100% {
    opacity: 0;
    transform:
      translate(25px,115px)
      rotate(12deg)
      scale(.45);
  }
}
@keyframes floatingFlicker {
  0%,100% {
    filter: brightness(1);
  }
  45% {
    filter: brightness(.45);
  }
  48% {
    filter: brightness(1.8);
  }
  52% {
    filter: brightness(.55);
  }
}
@keyframes givenchyBounce {
  0% {
    opacity: 0;
    transform:
      translate(0,0)
      rotate(-8deg)
      scale(.4);
  }
  15% {
    opacity: .35;
  }
  30% {
    transform:
      translate(30px,-20px)
      rotate(10deg)
      scale(.65);
  }
  50% {
    opacity: .15;
    transform:
      translate(-25px,30px)
      rotate(-7deg)
      scale(.5);
  }
  70% {
    opacity: .4;
    transform:
      translate(20px,60px)
      rotate(8deg)
      scale(.65);
  }
  100% {
    opacity: 0;
    transform:
      translate(-15px,110px)
      rotate(-10deg)
      scale(.35);
  }
}
@keyframes givenchyFlicker {
  0%,100% {
    filter:
      brightness(1)
      contrast(1);
  }
  47% {
    filter: brightness(.5);
  }
  50% {
    filter:
      brightness(1.7)
      contrast(1.4);
  }
  53% {
    filter: brightness(.7);
  }
}
/* =========================
   CONTENIDO
========================= */
.content {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top:
    max(7px, env(safe-area-inset-top));
  opacity: 0;
  transform:
    scale(.96)
    translateY(8px);
  transition:
    opacity .8s ease,
    transform .8s ease;
}
.content.visible {
  opacity: 1;
  transform:
    scale(1)
    translateY(0);
}
/* =========================
   LOGO
========================= */
.brand-logo {
  width: 58px;
  height: auto;
  margin-bottom: 3px;
  object-fit: contain;
  filter:
    drop-shadow(
      0 0 13px
      rgba(255,0,0,.3)
    );
  animation:
    brandDance
    2.4s
    ease-in-out
    infinite;
}
@keyframes brandDance {
  0%,100% {
    transform:
      translateY(0)
      rotate(0deg);
  }
  25% {
    transform:
      translateY(-5px)
      rotate(-3deg);
  }
  50% {
    transform:
      translateY(2px)
      rotate(3deg);
  }
  75% {
    transform:
      translateY(-3px)
      rotate(-2deg);
  }
}
/* =========================
   FOTO PRINCIPAL
========================= */
.main-image {
  position: relative;
  width:
    min(88vw, 470px);
  display: flex;
  align-items: center;
  justify-content: center;
  animation:
    imageBounce
    2.5s
    ease-in-out
    infinite;
}
.main-image > img {
  width: 100%;
  height: auto;
  display: block;
  filter:
    contrast(1.2)
    brightness(.93)
    drop-shadow(
      0 0 25px
      rgba(0,0,0,.95)
    );
  animation:
    imageGlitch
    2.7s
    infinite;
}
/* =========================
   GLITCH
========================= */
.main-image::before,
.main-image::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    url(
      "https://files.catbox.moe/3ixrpv.png"
    );
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  opacity: 0;
  pointer-events: none;
}
.main-image::before {
  animation:
    glitchOne
    2.5s
    infinite;
}
.main-image::after {
  animation:
    glitchTwo
    2.5s
    infinite;
}
@keyframes imageBounce {
  0%,100% {
    transform:
      translateY(0)
      rotate(0deg);
  }
  25% {
    transform:
      translateY(-6px)
      rotate(-1deg);
  }
  50% {
    transform:
      translateY(3px)
      rotate(1deg);
  }
  75% {
    transform:
      translateY(-3px)
      rotate(0deg);
  }
}
@keyframes imageGlitch {
  0%,87%,100% {
    transform: translate(0);
  }
  88% {
    transform:
      translate(-7px,2px);
  }
  89% {
    transform:
      translate(8px,-2px);
  }
  90% {
    transform:
      translate(-4px,0);
  }
  92% {
    transform: translate(0);
  }
}
@keyframes glitchOne {
  0%,83%,100% {
    opacity: 0;
  }
  84% {
    opacity: .55;
    transform:
      translate(-11px,0);
    clip-path:
      inset(10% 0 65% 0);
  }
  87% {
    opacity: 0;
  }
}
@keyframes glitchTwo {
  0%,88%,100% {
    opacity: 0;
  }
  89% {
    opacity: .5;
    transform:
      translate(11px,0);
    clip-path:
      inset(55% 0 20% 0);
  }
  92% {
    opacity: 0;
  }
}
/* =========================
   ARRIBA MÉXICO
========================= */
.titulo {
  margin-top: 4px;
  text-align: center;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow:
    0 0 8px #000,
    0 0 15px rgba(255,255,255,.25);
  animation:
    titleDance
    1.7s
    ease-in-out
    infinite;
}
.verde {
  color: #006847;
}
.blanco {
  color: #fff;
}
.rojo {
  color: #ce1126;
}
@keyframes titleDance {
  0%,100% {
    transform:
      translateY(0)
      rotate(0deg);
    opacity: .75;
  }
  25% {
    transform:
      translateY(-4px)
      rotate(-2deg);
    opacity: 1;
  }
  50% {
    transform:
      translateY(2px)
      rotate(2deg);
    opacity: .6;
  }
  75% {
    transform:
      translateY(-3px)
      rotate(-1deg);
    opacity: 1;
  }
}
/* =========================
   MÓVIL
========================= */
@media (max-width:430px) {
  .content {
    padding-top:
      max(
        7px,
        env(safe-area-inset-top)
      );
  }
  .brand-logo {
    width: 58px;
    margin-bottom: 3px;
  }
  .main-image {
    width: 88vw;
  }
  .titulo {
    font-size: 15px;
    margin-top: 4px;
    letter-spacing: 1.5px;
  }
  .floating {
    width: 58px;
  }
  .givenchy-floating {
    width: 46px;
  }
}
/* =========================
   PANTALLAS BAJAS
========================= */
@media (max-height:700px) {
  .brand-logo {
    width: 48px;
  }
  .main-image {
    width: 82vw;
  }
  .titulo {
    font-size: 13px;
  }
}
/* =========================
   REDUCE MOTION
========================= */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration:
      .001ms !important;
    animation-iteration-count:
      1 !important;
  }
}
</style>
</head>
<body>
<!-- =========================
     INTRO
========================= -->
<section
  class="intro"
  id="intro">
  <video
    class="intro-video"
    id="introVideo"
    src="https://files.catbox.moe/l8qahy.mov"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto">
  </video>
  <button
    class="enter"
    id="enter"
    type="button">
    ENTER
  </button>
</section>
<!-- =========================
     VIDEO PRINCIPAL
========================= -->
<video
  class="main-video"
  id="mainVideo"
  src="https://files.catbox.moe/l8qahy.mov"
  muted
  loop
  playsinline
  webkit-playsinline
  preload="auto">
</video>
<div class="dark-layer"></div>
<!-- =========================
     FLOTANTES
========================= -->
<div class="floating-container">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="floating"
    src="https://files.catbox.moe/qgbk6c.png">
  <img
    class="givenchy-floating"
    src="https://files.catbox.moe/1k4n1o.png">
  <img
    class="givenchy-floating"
    src="https://files.catbox.moe/1k4n1o.png">
  <img
    class="givenchy-floating"
    src="https://files.catbox.moe/1k4n1o.png">
  <img
    class="givenchy-floating"
    src="https://files.catbox.moe/1k4n1o.png">
</div>
<!-- =========================
     CONTENIDO
========================= -->
<main
  class="content"
  id="content">
  <img
    class="brand-logo"
    src="https://files.catbox.moe/1k4n1o.png"
    alt="Givenchy Farms">
  <div class="main-image">
    <img
      src="https://files.catbox.moe/3ixrpv.png"
      alt="Imagen principal">
  </div>
  <div class="titulo">
    <span class="verde">
      ARRIBA
    </span>
    <span class="blanco">
      PAPÁ
    </span>
    <span class="rojo">
      MENCHO
    </span>
  </div>
</main>
<!-- =========================
     MÚSICA
========================= -->
<audio
  id="music"
  src="https://files.catbox.moe/jwugnd.mp3"
  loop
  preload="auto">
</audio>
<script>
/* =========================
   ELEMENTOS
========================= */
const intro =
  document.getElementById("intro");
const enter =
  document.getElementById("enter");
const content =
  document.getElementById("content");
const music =
  document.getElementById("music");
const introVideo =
  document.getElementById("introVideo");
const mainVideo =
  document.getElementById("mainVideo");
/* =========================
   VIDEO INTRO
========================= */
introVideo
  .play()
  .catch(() => {});
/* =========================
   ENTER
========================= */
enter.addEventListener(
  "click",
  async () => {
    /* MÚSICA */
    try {
      music.currentTime = 0;
      await music.play();
    } catch(error) {
      console.log(
        "Safari bloqueó el audio:",
        error
      );
    }
    /* VIDEO PRINCIPAL */
    try {
      await mainVideo.play();
    } catch(error) {
      console.log(
        "No se pudo reproducir el video:",
        error
      );
    }
    /* PAUSAR INTRO */
    try {
      introVideo.pause();
    } catch(error) {}
    /* OCULTAR INTRO */
    intro.classList.add("hidden");
    /* MOSTRAR CONTENIDO */
    setTimeout(() => {
      content.classList.add("visible");
    }, 150);
    /* ELIMINAR INTRO */
    setTimeout(() => {
      intro.remove();
    }, 850);
  });
</script>
</body>
</html>
